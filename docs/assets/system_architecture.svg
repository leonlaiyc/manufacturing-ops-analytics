<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Manufacturing operations analytics system architecture</title>
  <desc id="desc">System architecture showing public production log diagnosis, synthetic fab simulation, analysis engines, agentic decision support, and public evidence outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .box { fill:#eeecff; stroke:#b7a7ff; stroke-width:2; rx:6; }
      .panel { fill:#fffbd8; stroke:#d0c65c; stroke-width:2; rx:4; }
      .label { font:700 20px Arial, Helvetica, sans-serif; fill:#24313f; }
      .text { font:18px Arial, Helvetica, sans-serif; fill:#24313f; }
      .small { font:16px Arial, Helvetica, sans-serif; fill:#24313f; }
      .line { fill:none; stroke:#4b5563; stroke-width:2; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#7a7f87; stroke-width:2; stroke-dasharray:6 6; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Left input and trust layer -->
  <rect class="box" x="40" y="70" width="310" height="120"/>
  <text class="text" text-anchor="middle" x="195" y="105">
    <tspan x="195" dy="0">Data quality and reliability</tspan>
    <tspan x="195" dy="24">checks</tspan>
    <tspan x="195" dy="24">schema, drift, model cards</tspan>
  </text>

  <rect class="box" x="40" y="330" width="310" height="95"/>
  <text class="text" text-anchor="middle" x="195" y="366">
    <tspan x="195" dy="0">Real production log</tspan>
    <tspan x="195" dy="24">public data, diagnosis only</tspan>
  </text>

  <rect class="box" x="40" y="650" width="310" height="105"/>
  <text class="text" text-anchor="middle" x="195" y="688">
    <tspan x="195" dy="0">Synthetic fab simulator</tspan>
    <tspan x="195" dy="24">fixed-seed DES, known</tspan>
    <tspan x="195" dy="24">ground truth</tspan>
  </text>

  <!-- Process mining above the two main panels -->
  <rect class="box" x="650" y="95" width="360" height="90"/>
  <text class="text" text-anchor="middle" x="830" y="130">
    <tspan x="830" dy="0">Process mining</tspan>
    <tspan x="830" dy="24">case paths, waiting, rework</tspan>
  </text>

  <!-- Analysis engines -->
  <rect class="panel" x="430" y="255" width="390" height="570"/>
  <text class="label" text-anchor="middle" x="625" y="292">Analysis and what-if engines</text>

  <rect class="box" x="510" y="325" width="230" height="55"/>
  <text class="text" text-anchor="middle" x="625" y="359">Bottleneck proof</text>

  <rect class="box" x="485" y="420" width="280" height="55"/>
  <text class="text" text-anchor="middle" x="625" y="454">Slow-drift monitoring</text>

  <rect class="box" x="500" y="515" width="250" height="55"/>
  <text class="text" text-anchor="middle" x="625" y="549">Capacity investment</text>

  <rect class="box" x="515" y="610" width="220" height="55"/>
  <text class="text" text-anchor="middle" x="625" y="644">Yield trade-off</text>

  <rect class="box" x="505" y="705" width="240" height="55"/>
  <text class="text" text-anchor="middle" x="625" y="739">Maintenance timing</text>

  <rect class="box" x="505" y="785" width="240" height="55"/>
  <text class="text" text-anchor="middle" x="625" y="819">Dispatching policy</text>

  <!-- Agentic decision support -->
  <rect class="panel" x="900" y="255" width="390" height="570"/>
  <text class="label" text-anchor="middle" x="1095" y="292">Agentic decision support</text>

  <rect class="box" x="985" y="330" width="220" height="80"/>
  <text class="text" text-anchor="middle" x="1095" y="360">
    <tspan x="1095" dy="0">Logged simulation tools</tspan>
    <tspan x="1095" dy="24">validated inputs, run IDs</tspan>
  </text>

  <rect class="box" x="965" y="475" width="260" height="95"/>
  <text class="text" text-anchor="middle" x="1095" y="507">
    <tspan x="1095" dy="0">Traceable analysis record</tspan>
    <tspan x="1095" dy="24">scenario, seed,</tspan>
    <tspan x="1095" dy="24">assumptions, KPI</tspan>
  </text>

  <rect class="box" x="965" y="640" width="260" height="95"/>
  <text class="text" text-anchor="middle" x="1095" y="672">
    <tspan x="1095" dy="0">LLM memo layer</tspan>
    <tspan x="1095" dy="24">tool outputs only,</tspan>
    <tspan x="1095" dy="24">no free-form numbers</tspan>
  </text>

  <rect class="box" x="965" y="780" width="260" height="95"/>
  <text class="text" text-anchor="middle" x="1095" y="812">
    <tspan x="1095" dy="0">Verified decision memo</tspan>
    <tspan x="1095" dy="24">numbers checked against</tspan>
    <tspan x="1095" dy="24">the run log</tspan>
  </text>

  <!-- Public evidence -->
  <rect class="box" x="1345" y="430" width="240" height="120"/>
  <text class="text" text-anchor="middle" x="1465" y="462">
    <tspan x="1465" dy="0">Public evidence</tspan>
    <tspan x="1465" dy="24">README, design docs</tspan>
    <tspan x="1465" dy="24">notebooks</tspan>
    <tspan x="1465" dy="24">GitHub Pages</tspan>
  </text>

  <!-- Connections -->
  <path class="dash" d="M350 130 C455 120, 530 118, 650 125"/>
  <path class="dash" d="M350 130 C390 260, 405 370, 430 405"/>
  <path class="line" d="M350 377 C350 190, 520 125, 650 140"/>
  <path class="line" d="M350 702 C385 665, 400 540, 430 540"/>
  <path class="line" d="M820 540 L900 540"/>
  <path class="line" d="M1095 410 L1095 475"/>
  <path class="line" d="M1095 570 L1095 640"/>
  <path class="line" d="M1095 735 L1095 780"/>
  <path class="line" d="M1010 140 C1160 100, 1345 120, 1345 455"/>
  <path class="line" d="M1290 540 C1325 540, 1335 515, 1360 505"/>
</svg>
